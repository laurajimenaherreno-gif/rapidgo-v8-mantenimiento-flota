name: CI RapidGo V8
run-name: CI ejecutado por ${{ github.actor }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests airflow/dags   # CAMBIO 1

      - name: Ejecutar pruebas (reglas, contrato y generador)
        run: pytest -v

      - name: Validar Docker Compose
        run: docker compose config --quiet

  validar-dag:   # CAMBIO 2, job nuevo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar Airflow
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.2.2" pytest pyarrow --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-3.13.txt"

      - name: Probar el DAG
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest tests/test_dag.py -v
        